name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit, assistant, and env tests
        run: npm test
        env:
          FAL_KEY: ci_placeholder
          DEEPSEEK_API_KEY: ci_placeholder

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_ci_placeholder' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E smoke
        # Public funnel works with placeholders after the 127.0.0.1 webServer fix, but full
        # Clerk auth E2E needs real keys + E2E_CLERK_USER_*. Skip when secrets are missing
        # so CI stays green until those are configured in GitHub.
        run: |
          if [[ "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" == *placeholder* ]] || [[ "${CLERK_SECRET_KEY}" == *placeholder* ]]; then
            echo "Skipping E2E: Clerk keys are CI placeholders."
            echo "Add NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY + CLERK_SECRET_KEY (and E2E_CLERK_USER_*) as GitHub Actions secrets to enable."
            exit 0
          fi
          npm run test:e2e
        env:
          CI: true
          # Bind checks use 127.0.0.1 (see playwright.config.ts) — avoid localhost/::1 hangs.
          PORT: "3000"
          FAL_KEY: ci_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_ci_placeholder' }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
